#4ade80"/><text x="227" y="151" font-size="12" class="t">Discord API</text></g><g class="up" style="animation-delay:0.54s"><rect x="323" y="134" width="60" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="336" cy="147" r="2.5" fill="#4ade80"/><text x="346" y="151" font-size="12" class="t">REST</text></g><g class="up" style="animation-delay:0.62s"><rect x="391" y="134" width="60" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="404" cy="147" r="2.5" fill="#4ade80"/><text x="414" y="151" font-size="12" class="t">Bash</text></g><text x="32" y="182" font-size="13" class="m"># cloud &amp; linux</text><g class="up" style="animation-delay:0.60s"><rect x="32" y="192" width="89" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="45" cy="205" r="2.5" fill="#4ade80"/><text x="55" y="209" font-size="12" class="t">Azure VM</text></g><g class="up" style="animation-delay:0.68s"><rect x="129" y="192" width="163" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="142" cy="205" r="2.5" fill="#4ade80"/><text x="152" y="209" font-size="12" class="t">Cloudflare WAF/CDN</text></g><g class="up" style="animation-delay:0.76s"><rect x="300" y="192" width="52" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="313" cy="205" r="2.5" fill="#4ade80"/><text x="323" y="209" font-size="12" class="t">Git</text></g><g class="up" style="animation-delay:0.84s"><rect x="360" y="192" width="104" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="373" cy="205" r="2.5" fill="#4ade80"/><text x="383" y="209" font-size="12" class="t">Arch Linux</text></g><g class="up" style="animation-delay:0.92s"><rect x="472" y="192" width="89" height="26" rx="13" fill="#161b22" stroke="#30363d"/><circle cx="485" cy="205" r="2.5" fill="#4ade80"/><text x="495" y="209" font-size="12" class="t">Hyprland</text></g>
</g>
<rect x=".5" y=".5" width="899" height="249" rx="12" fill="none" stroke="#30363d"/>
</svg>
