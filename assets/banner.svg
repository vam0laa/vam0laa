<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="vam0laa@archlinux: ~">
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".9"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="900" height="260" rx="12"/></clipPath>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.d{fill:#8b949e} .t{fill:#e6edf3} .a{fill:#4ade80} .m{fill:#6e7681}
@keyframes fade{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{opacity:0;animation:fade .5s ease-out forwards}
.up{opacity:0;animation:fadeUp .5s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.scan{animation:scan 5s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mv1{to{transform:translateX(105.6px)}}
@keyframes mv2{to{transform:translateX(633.5999999999999px)}}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.type1{animation:type .9s steps(8,end) .5s both}
.type2{animation:type 2.4s steps(48,end) 1.9s both}
.cur1{animation:mv1 .9s steps(8,end) .5s forwards,gone .01s 1.5s forwards}
.cur2{opacity:0;animation:mv2 2.4s steps(48,end) 1.9s forwards,show .01s 1.9s forwards}
.blink{animation:blink 1s steps(1) 4.3s infinite}
</style>
<g clip-path="url(#card)">
<rect width="900" height="260" fill="#0d1117"/>
<rect width="900" height="260" fill="url(#grid)"/>
<rect class="scan" x="0" y="36" width="300" height="1.5" fill="url(#sweep)"/>
<rect width="900" height="36" fill="#09090b"/>
<line x1="0" y1="36" x2="900" y2="36" stroke="#27272a"/>
<circle cx="22" cy="18" r="5.5" fill="#3f3f46"/><circle cx="42" cy="18" r="5.5" fill="#3f3f46"/><circle cx="62" cy="18" r="5.5" fill="#4ade80" opacity=".85"/>
<text x="450" y="22" text-anchor="middle" font-size="12" class="m">vam0laa@archlinux: ~</text>

<text x="40" y="98" font-size="22" textLength="105.6" lengthAdjust="spacing" class="type1"><tspan class="a">$</tspan><tspan class="t"> whoami</tspan></text>
<text x="40" y="152" font-size="22" textLength="633.5999999999999" lengthAdjust="spacing" class="type2"><tspan class="t" font-weight="700">vam0laa</tspan><tspan class="d"> — </tspan><tspan class="t">Full-Stack Web &amp; Discord Bot Developer</tspan></text>
<g class="cur1"><rect x="40" y="80" width="12" height="24" fill="#4ade80"/></g>
<g class="cur2"><g class="blink"><rect x="40" y="134" width="12" height="24" fill="#4ade80"/></g></g>
<g class="up" style="animation-delay:4.3s"><text x="40" y="214" font-size="15"><tspan class="a">↳ </tspan><tspan class="t">vamola.dev</tspan><tspan class="m">  •  </tspan><tspan class="t">karia.live</tspan><tspan class="m">  •  </tspan><tspan class="t">contact@vamola.dev</tspan></text></g>
</g>
<rect x=".5" y=".5" width="899" height="259" rx="12" fill="none" stroke="#30363d"/>
</svg>
