<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="fastfetch">
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".9"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="900" height="330" rx="12"/></clipPath>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.d{fill:#8b949e} .t{fill:#e6edf3} .a{fill:#4ade80} .m{fill:#6e7681}
@keyframes fade{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{opacity:0;animation:fade .5s ease-out forwards}
.up{opacity:0;animation:fadeUp .5s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.scan{animation:scan 5s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes wave{0%,100%{opacity:.45}50%{opacity:1}}
.tri,.tri2{stroke-dasharray:100;animation:draw 6s ease-in-out infinite}
.tri2{animation-delay:.4s}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.blk{animation:wave 2.4s ease-in-out infinite}
</style>
<g clip-path="url(#card)">
<rect width="900" height="330" fill="#0d1117"/>
<rect width="900" height="330" fill="url(#grid)"/>
<rect class="scan" x="0" y="36" width="300" height="1.5" fill="url(#sweep)"/>
<rect width="900" height="36" fill="#09090b"/>
<line x1="0" y1="36" x2="900" y2="36" stroke="#27272a"/>
<circle cx="22" cy="18" r="5.5" fill="#3f3f46"/><circle cx="42" cy="18" r="5.5" fill="#3f3f46"/><circle cx="62" cy="18" r="5.5" fill="#4ade80" opacity=".85"/>
<text x="450" y="22" text-anchor="middle" font-size="12" class="m">fastfetch</text>

<g transform="translate(60 70)">
<g class="ring"><circle cx="100" cy="100" r="92" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 9"/></g>
<path class="tri" d="M100 22 L168 162 Q100 132 32 162 Z" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" pathLength="100"/>
<path class="tri2" d="M100 62 L132 138 Q100 124 68 138 Z" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-linejoin="round" pathLength="100" opacity=".7"/>
<circle class="pulse" cx="100" cy="22" r="4" fill="#4ade80"/>
</g><text x="330" y="84" font-size="16" font-weight="700"><tspan class="a">vam0laa</tspan><tspan class="d">@</tspan><tspan class="a">archlinux</tspan></text>
<line x1="330" y1="96" x2="493.2" y2="96" stroke="#30363d"/><g class="in" style="animation-delay:0.40s"><text x="330" y="128" font-size="14" font-weight="700" class="a">OS</text><text x="410" y="128" font-size="14" class="t">Arch Linux (Hyprland / Wayland)</text></g><g class="in" style="animation-delay:0.65s"><text x="330" y="158" font-size="14" font-weight="700" class="a">Focus</text><text x="410" y="158" font-size="14" class="t">Web Applications, Docs &amp; Linux Tooling</text></g><g class="in" style="animation-delay:0.90s"><text x="330" y="188" font-size="14" font-weight="700" class="a">Stack</text><text x="410" y="188" font-size="14" class="t">Go, Next.js, TypeScript, React, Node.js, Python</text></g><g class="in" style="animation-delay:1.15s"><text x="330" y="218" font-size="14" font-weight="700" class="a">Infra</text><text x="410" y="218" font-size="14" class="t">Azure VM, Cloudflare WAF/CDN, Git, Bash</text></g><g class="in" style="animation-delay:1.40s"><text x="330" y="248" font-size="14" font-weight="700" class="a">Contact</text><text x="410" y="248" font-size="14" class="t">contact@vamola.dev</text></g><rect class="blk" style="animation-delay:0s" x="330" y="284" width="26" height="16" rx="3" fill="#18181b"/><rect class="blk" style="animation-delay:0.15s" x="360" y="284" width="26" height="16" rx="3" fill="#27272a"/><rect class="blk" style="animation-delay:0.3s" x="390" y="284" width="26" height="16" rx="3" fill="#3f3f46"/><rect class="blk" style="animation-delay:0.44999999999999996s" x="420" y="284" width="26" height="16" rx="3" fill="#52525b"/><rect class="blk" style="animation-delay:0.6s" x="450" y="284" width="26" height="16" rx="3" fill="#71717a"/><rect class="blk" style="animation-delay:0.75s" x="480" y="284" width="26" height="16" rx="3" fill="#a1a1aa"/><rect class="blk" style="animation-delay:0.8999999999999999s" x="510" y="284" width="26" height="16" rx="3" fill="#d4d4d8"/><rect class="blk" style="animation-delay:1.05s" x="540" y="284" width="26" height="16" rx="3" fill="#4ade80"/>
</g>
<rect x=".5" y=".5" width="899" height="329" rx="12" fill="none" stroke="#30363d"/>
</svg>
